# PR-Agent: auto review on PR open; comment /review, /describe, /improve, or /ask to rerun.
# Needs repo secret OPENROUTER_KEY. Models follow the OpenRouter policy: DeepSeek V4.1 Flash, GLM 5.3 Flash.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Auto on PR open; on demand when a trusted user comments /review, /describe, /improve, or /ask.
    if: >
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event.issue.pull_request && startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          CONFIG__MODEL: openrouter/deepseek/deepseek-v4.1-flash-1017
          CONFIG__MODEL_WEAK: openrouter/z-ai/glm-5.3-flash
          CONFIG__FALLBACK_MODELS: '["openrouter/z-ai/glm-5.3-flash"]'
          CONFIG__REASONING_EFFORT: high
          CONFIG__MAX_MODEL_TOKENS: "128000"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
          PR_REVIEWER__NUM_MAX_FINDINGS: "3"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
