on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  # Automatic on PR open/push, or manual any time by commenting /review.
  review_standard:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    name: "PR Review — standard (gpt-5.6-luna)"
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          # gpt-5.6-luna: 50%-off promo price ($0.10/$0.60 per M), 1.05M context — cheaper
          # than gemini-2.5-flash's normal price, from a frontier lab. Re-check
          # openrouter.ai/collections/discounted-models before this promo ends.
          CONFIG__MODEL: "openrouter/openai/gpt-5.6-luna"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"

  # Confirmed via live testing: labels alone can't trigger anything. PR-Agent's
  # container is 100% event-driven (checked its source, github_action_runner.py).
  # A "labeled" pull_request event is not in its default PR_ACTIONS allowlist, and
  # overriding that via env var did NOT work either (tested live — still logs
  # "Skipping action: labeled" even with GITHUB_ACTION_CONFIG__PR_ACTIONS set).
  # The only mechanism that reliably works (proven across many live tests this
  # session) is issue_comment + parsing real comment text. So: add the label to
  # pick which model/tier answers, then comment the actual command yourself.
  review_feature:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/review') &&
      contains(github.event.issue.labels.*.name, 'review:feature')
    runs-on: ubuntu-latest
    name: "PR Review — feature depth (gpt-5.6-terra)"
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          # gpt-5.6-terra: 50%-off promo price ($1/$6 per M), 1.05M context — same
          # tier as claude-sonnet-4.5 for half the cost while the promo lasts.
          CONFIG__MODEL: "openrouter/openai/gpt-5.6-terra"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "300000"
          CONFIG__MAX_MODEL_TOKENS: "300000"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >
            Focus on whether this PR actually delivers the full feature described
            in its title/description: missing edge cases, incomplete error handling,
            gaps versus the stated intent, and missing tests.

  review_architecture:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/review') &&
      contains(github.event.issue.labels.*.name, 'review:arch')
    runs-on: ubuntu-latest
    name: "PR Review — architecture (gemini-2.5-pro)"
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          CONFIG__MODEL: "openrouter/google/gemini-2.5-pro"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "400000"
          CONFIG__MAX_MODEL_TOKENS: "400000"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >
            Do an architectural pass: module boundaries, dependency direction,
            API/contract design, coupling, and long-term maintainability.
            Do not repeat line-level nitpicks already covered by a standard review.

  # Usage: add the review:plan label, then comment "/ask <your actual question>"
  # (e.g. "/ask does this PR fully implement the plan in the description?").
  review_plan:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ask') &&
      contains(github.event.issue.labels.*.name, 'review:plan')
    runs-on: ubuntu-latest
    name: "PR Review — plan compliance (gpt-5.6-terra)"
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          CONFIG__MODEL: "openrouter/openai/gpt-5.6-terra"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "300000"
          CONFIG__MAX_MODEL_TOKENS: "300000"
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
